name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 러너에는 Android SDK가 미리 설치되어 있다 (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CarMirror-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-debug-apk
          path: CarMirror-${{ github.run_number }}.apk

      # 폰 브라우저에서 바로 받을 수 있도록 Releases에도 올린다 (zip 아님)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarMirror build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: CarMirror-${{ github.run_number }}.apk
